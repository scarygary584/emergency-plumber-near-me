  />
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="140" y="236" font-size="22" font-weight="700" fill="#0b2f57">
      Notice the signs
    </text>
    <text x="140" y="262" font-size="16" fill="#34495b">
      Warmth, moisture, meter movement
    </text>
  </g>
  <path
    d="M245 150h70"
